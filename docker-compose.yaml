services: 
  nginx-rtmp:
    image: tiangolo/nginx-rtmp
    container_name: rtmp-server
    ports:
      - "1935:1935" # RTMP Ingest
      - "8080:8080"   # HLS Playback
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./hls:/tmp/hls  # Persist HLS arguments if needed
    restart: unless-stopped